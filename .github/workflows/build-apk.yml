name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # 1. 准备网页文件 + 混淆 app.js
      - name: 准备网页+混淆
        run: |
          npm install -g javascript-obfuscator 2>/dev/null
          mkdir -p web
          javascript-obfuscator app.js --output web/app.js \
            --compact true --string-array true --string-array-encoding base64 \
            --self-defending false --control-flow-flattening false 2>/dev/null || cp app.js web/app.js
          cp index.html config.js manifest.json sw.js web/
          cat > .capacitorignore <<'EOF'
          android
          .git
          .github
          node_modules
          EOF
          echo "✅ 网页就绪（app.js已混淆）"

      # 2. 初始化 Capacitor
      - name: 初始化
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.huaxueshe.app","appName":"花学社","webDir":"web","android":{"allowMixedContent":true,"backgroundColor":"#F0E6FF"}}
          EOF
          npx cap add android
          npx cap sync android
          echo "✅ 原生项目生成"

      # 3. 注入 防root+防抓包
      - name: 注入安全检测
        run: |
          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          cat > "$MAIN" <<'EOF'
          package com.huaxueshe.app;
          import android.os.Bundle;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              if(isRooted()){ Toast.makeText(this,"检测到Root环境，已阻止运行",Toast.LENGTH_LONG).show(); finish(); return; }
              if(isProxy()){ Toast.makeText(this,"检测到网络代理，已阻止运行",Toast.LENGTH_LONG).show(); finish(); return; }
            }
            private boolean isRooted(){
              String[] ps={"/system/bin/su","/system/xbin/su","/sbin/su","/data/local/xbin/su","/system/app/Superuser.apk","/sbin/.magisk"};
              for(String p:ps){ if(new java.io.File(p).exists()) return true; }
              try{ Process pr=Runtime.getRuntime().exec(new String[]{"which","su"}); return pr.waitFor()==0; }catch(Exception e){ return false; }
            }
            private boolean isProxy(){
              return System.getProperty("http.proxyHost")!=null || System.getProperty("https.proxyHost")!=null;
            }
          }
          EOF
          echo "✅ 防root/防代理注入完成"

      # 4. 生成签名密钥
      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v -keystore /tmp/huaxueshe.keystore -alias huaxueshe \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass huaxueshe123 -keypass huaxueshe123 \
            -dname "CN=huaxueshe, OU=dev, O=huaxueshe, L=Beijing, ST=Beijing, C=CN" 2>/dev/null
          echo "✅ 密钥已生成（密码 huaxueshe123，请保留）"

      # 5. 构建（失败也保留日志）
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee /tmp/build.log
        continue-on-error: true

      # 6. 签名 + 校验
      - name: 签名校验
        run: |
          BT=$(ls -d ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/* 2>/dev/null | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$UNSIGNED" ]; then
            "$BT/apksigner" sign --ks /tmp/huaxueshe.keystore --ks-pass pass:huaxueshe123 --out /tmp/app-release.apk "$UNSIGNED" 2>/dev/null || cp "$UNSIGNED" /tmp/app-release.apk
            "$BT/apksigner" verify /tmp/app-release.apk && echo "✅ 签名校验通过"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/app-release.apk 2>/dev/null || echo "⚠️ 未找到APK，查看日志"
          fi

      # 7. 上传：APK + 签名 + 报错日志
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 花学社-APK-签名-日志
          path: |
            /tmp/app-release.apk
            /tmp/huaxueshe.keystore
            /tmp/build.log
            android/app/build/reports/**